name: Refresh profile art

"on":
  schedule:
    - cron: "17 5 * * *"      # ~07:17 SAST daily
  workflow_dispatch: {}
  push:
    branches: [main]
    paths:
      - "scripts/**"
      - "data/identity.json"
      - ".github/workflows/refresh.yml"

permissions:
  contents: write

concurrency:
  group: refresh
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scripts/requirements.txt

      - run: pip install -r scripts/requirements.txt

      # Fails the run if the calendar collapses, which is what happens when
      # "Include private contributions on my profile" gets switched off. Better
      # a red X than a graph quietly claiming Cameron did nothing all year.
      - name: Scrape the contribution calendar
        run: python scripts/fetch_contributions.py

      # Only the three sections that carry live numbers. The rest are either
      # static or need Cameron's own `gh` auth to see the private repos, which
      # GITHUB_TOKEN inside this repo cannot do — those are rendered locally and
      # committed.
      - name: Re-ink the live sections
        run: |
          python scripts/render_heatmap.py
          python scripts/render_momentum.py
          python scripts/render_week.py

      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: refresh contribution sections [skip ci]"
          file_pattern: >-
            data/contributions.json
            assets/04-commits.svg
            assets/06-momentum.svg
            assets/08-week.svg
