<svg xmlns="http://www.w3.org/2000/svg" width="846" height="174" viewBox="0 0 846 174" role="img" aria-label="What I do"><title>What I do</title><style>@keyframes rise{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@keyframes wipe{from{opacity:0;transform:translateX(-10px)}to{opacity:1;transform:none}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@keyframes pop{from{opacity:0;transform:translateY(-5px) scale(.86)}to{opacity:1;transform:none}}
.r{animation:rise .52s cubic-bezier(.2,.8,.2,1) both}
.w{animation:wipe .5s cubic-bezier(.2,.8,.2,1) both}
.g{transform-origin:left center;animation:grow .7s cubic-bezier(.2,.8,.2,1) both}</style><rect width="846" height="174" fill="#07090A"/><text class="r" x="44" y="66" fill="#E7F0EA" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="27" font-weight="700" letter-spacing="-.6">Web and app designer.</text><text class="r" x="44" y="113" fill="#7E9188" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="300" style="animation-delay:0.08s">I design the thing, build it, and run the ads that</text><text class="r" x="44" y="140" fill="#7E9188" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="17" font-weight="300" style="animation-delay:0.13s">sell it. One person, both halves.</text><line x1="484" y1="40" x2="484" y2="148" stroke="#1A2226"/><g class="w" style="animation-delay:0.16s"><text x="518" y="60" fill="#00FF41" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">›</text><text x="538" y="60" fill="#E7F0EA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">Interfaces and design systems</text></g><g class="w" style="animation-delay:0.22s"><text x="518" y="85" fill="#00FF41" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">›</text><text x="538" y="85" fill="#E7F0EA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">Web and product engineering</text></g><g class="w" style="animation-delay:0.28s"><text x="518" y="110" fill="#00FF41" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">›</text><text x="538" y="110" fill="#E7F0EA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">Tracking and attribution</text></g><g class="w" style="animation-delay:0.34s"><text x="518" y="135" fill="#00FF41" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11">›</text><text x="538" y="135" fill="#E7F0EA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="12.5">Paid media, Meta and Google</text></g></svg>