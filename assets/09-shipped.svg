<svg xmlns="http://www.w3.org/2000/svg" width="846" height="406" viewBox="0 0 846 406" role="img" aria-label="What shipped"><title>What shipped</title><style>@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes dot{from{opacity:0;transform:scale(0)}to{opacity:1;transform:none}}
@keyframes rail{from{transform:scaleY(0)}to{transform:scaleY(1)}}
.r{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.d{animation:dot .45s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:center}
.rl{animation:rail .5s cubic-bezier(.2,.8,.2,1) both;transform-box:fill-box;transform-origin:top}</style><rect width="846" height="406" fill="#07090A"/><text x="44" y="34" fill="#495D54" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" font-weight="600" letter-spacing="2.2">SHIPPED</text><text x="802" y="34" fill="#495D54" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.1" text-anchor="end">LAST TWELVE MONTHS</text><rect class="rl" x="55" y="72" width="1" height="72" fill="#1A2226" style="animation-delay:0.18s"/><circle class="d" cx="55.5" cy="66" r="5.5" fill="#00FF41" style="animation-delay:0.06s"/><g class="r" style="animation-delay:0.12s"><text x="90" y="71" fill="#00FF41" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5">AUG 2026</text><text x="182" y="72" fill="#E7F0EA" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-.3">Krevio Money module shipped</text><text x="90" y="98" fill="#7E9188" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300">Sixteen slices in one pass. Best commit day of the year landed here.</text></g><rect class="rl" x="55" y="156" width="1" height="72" fill="#1A2226" style="animation-delay:0.28s"/><circle class="d" cx="55.5" cy="150" r="5.5" fill="#12B24A" style="animation-delay:0.16s"/><g class="r" style="animation-delay:0.22s"><text x="90" y="155" fill="#12B24A" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5">JUN 2026</text><text x="182" y="156" fill="#E7F0EA" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-.3">New Money Strategy Lab, all 17 boards</text><text x="90" y="182" fill="#7E9188" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300">Seventeen boards from one contract, built across four phases.</text></g><rect class="rl" x="55" y="240" width="1" height="72" fill="#1A2226" style="animation-delay:0.38s"/><circle class="d" cx="55.5" cy="234" r="5.5" fill="#0B7A2C" style="animation-delay:0.26s"/><g class="r" style="animation-delay:0.32s"><text x="90" y="239" fill="#0B7A2C" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5">MAR 2026</text><text x="182" y="240" fill="#E7F0EA" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-.3">Ikonik tracking stack rebuilt</text><text x="90" y="266" fill="#7E9188" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300">Meta CAPI plus server-side GA4. Attribution stopped being a guess.</text></g><circle class="d" cx="55.5" cy="318" r="5.5" fill="#0B7A2C" style="animation-delay:0.36s"/><g class="r" style="animation-delay:0.42s"><text x="90" y="323" fill="#0B7A2C" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="11" letter-spacing="1.5">DEC 2025</text><text x="182" y="324" fill="#E7F0EA" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="20" font-weight="700" letter-spacing="-.3">Float shell v2.2</text><text x="90" y="350" fill="#7E9188" font-family="'Archivo', ui-sans-serif, system-ui, -apple-system, 'Helvetica Neue', Arial, sans-serif" font-size="14" font-weight="300">Nine of twelve screens and a design system that holds.</text></g></svg>