<svg xmlns="http://www.w3.org/2000/svg" width="135" height="46" viewBox="0 0 135 46" role="img" aria-label="Instagram — opens in a new tab"><title>Instagram — opens in a new tab</title><style>@keyframes inn{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:none}}
@keyframes nudge{0%,72%{transform:none}80%{transform:translate(2.4px,-2.4px)}100%{transform:none}}
.btn{animation:inn .5s cubic-bezier(.2,.8,.2,1) 0.38s both}
.ar{animation:nudge 2.6s ease-in-out 1.28s infinite}</style><g class="btn"><rect x="1" y="1" width="133" height="44" rx="23" fill="#0C1013" stroke="#26333A" stroke-width="1"/><text x="22" y="28" fill="#E7F0EA" font-family="ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" font-weight="500" letter-spacing=".3">Instagram</text><g transform="translate(106.4,23.0)"><g class="ar"><path d="M-4 4 L4 -4" stroke="#00FF41" stroke-width="1.7" stroke-linecap="round"/><path d="M-0.6 -4 L4 -4 L4 0.6" stroke="#00FF41" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" fill="none"/></g></g></g></svg>